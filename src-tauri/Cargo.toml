[package]
name = "goxplan"
version = "0.3.0"
description = "Local-first household finance desktop application"
authors = ["GoXPlan"]
edition = "2021"

[lib]
name = "goxplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
