[package]
name = "goxplan"
version = "0.2.0"
description = "Local-first household finance desktop application"
authors = ["GoXPlan"]
edition = "2021"

[lib]
name = "goxplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
rusqlite = { version = "0.32.1", features = ["backup"] }
